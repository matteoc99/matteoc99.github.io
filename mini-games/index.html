<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Games</title>
    <style>
        :root {
            --amber: #835e0c;
            --amber-bright: #c79520;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: #000000;
            color: var(--amber);
            font-family: "Courier New", Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .container {
            padding: 14px;
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        h1 {
            font-size: clamp(2em, 9vw, 3em);
            margin: 10px 0;
            text-shadow: 0 0 2px var(--amber);
        }

        .subtitle {
            margin: 0 0 10px;
            font-size: 0.95em;
            min-height: 1.2em;
        }

        body.playing h1 { font-size: 1.4em; margin: 6px 0; }
        body.playing .subtitle,
        body.playing .menu-title { display: none; }

        .menu-title { font-size: 1.5em; margin: 18px 0 4px; }

        .blink { animation: blink 1.5s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        a.back {
            color: var(--amber);
            text-decoration: none;
            border-bottom: 1px solid var(--amber);
        }
        a.back:hover { text-shadow: 0 0 3px var(--amber); }

        /* ---- Game selection menu ---- */
        .menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-top: 16px;
            width: 100%;
        }

        .game-card {
            padding: 16px;
            border: 1px solid var(--amber);
            border-radius: 5px;
            cursor: pointer;
            flex: 1 1 150px;
            max-width: 220px;
            background: transparent;
            color: var(--amber);
            font-family: inherit;
            transition: text-shadow 0.15s, box-shadow 0.15s;
        }
        .game-card:hover, .game-card:active {
            text-shadow: 0 0 3px var(--amber);
            box-shadow: 0 0 8px rgba(199, 149, 32, 0.4);
        }
        .game-card h3 { margin: 0 0 8px; font-size: 1.25em; }
        .game-card p { margin: 0; font-size: 0.8em; opacity: 0.85; }

        .menu-divider {
            flex-basis: 100%;
            text-align: center;
            opacity: 0.7;
            letter-spacing: 2px;
            margin: 8px 0 0;
        }

        /* ---- Game stage ---- */
        .stage { display: none; width: 100%; flex-direction: column; align-items: center; }
        .stage.active { display: flex; }

        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 460px;
            margin: 4px auto;
            font-size: 1em;
        }

        canvas {
            background: #000;
            border: 1px solid var(--amber);
            border-radius: 5px;
            display: block;
            margin: 0 auto;
            touch-action: none;
            box-shadow: 0 0 12px rgba(131, 94, 12, 0.4);
        }

        .canvas-wrap { position: relative; display: inline-block; }

        .pause-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            color: var(--amber-bright);
            font-size: 1.6em;
            letter-spacing: 4px;
            border-radius: 5px;
            text-shadow: 0 0 4px var(--amber-bright);
        }
        .pause-overlay.show { display: flex; }

        /* CRT scanline overlay */
        .crt {
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.22) 0px,
                rgba(0, 0, 0, 0.22) 1px,
                rgba(0, 0, 0, 0) 1px,
                rgba(0, 0, 0, 0) 3px
            );
        }

        .hint {
            font-size: 0.8em;
            opacity: 0.8;
            margin: 6px 0;
            min-height: 1.1em;
        }

        /* ---- Touch control pads ---- */
        .pad-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            width: 100%;
            padding: 6px;
            user-select: none;
            touch-action: none;
        }
        .pad-area.top { transform: rotate(180deg); }
        .pad-area:empty { display: none; padding: 0; }

        .pad-col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .pad-row { display: flex; gap: 16px; }
        .pad-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .pad-label { font-size: 0.75em; letter-spacing: 1px; }

        .pad-btn {
            min-width: 60px;
            min-height: 60px;
            font-size: 1.4em;
            background: transparent;
            color: var(--amber);
            border: 1px solid var(--amber);
            border-radius: 8px;
            font-family: inherit;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            transition: background 0.05s, box-shadow 0.05s;
        }
        .pad-btn.wide { min-width: 110px; }
        .pad-btn.active {
            background: rgba(199, 149, 32, 0.25);
            box-shadow: 0 0 10px rgba(199, 149, 32, 0.5);
            text-shadow: 0 0 3px var(--amber);
        }

        .controls {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button.btn {
            background: transparent;
            color: var(--amber);
            border: 1px solid var(--amber);
            border-radius: 5px;
            font-family: inherit;
            font-size: 1em;
            padding: 10px 18px;
            cursor: pointer;
        }
        button.btn:active { background: rgba(199, 149, 32, 0.2); }

        footer { margin: 18px 0 8px; font-size: 0.85em; }
    </style>
</head>
<body>
<div class="container">
    <h1>Mini Games</h1>
    <p class="subtitle"><span id="tagline"></span><span class="blink">_</span></p>

    <!-- Menu -->
    <div id="menu">
        <div class="menu-title">1 Player</div>
        <div class="menu">
            <button class="game-card" data-game="snake">
                <h3>Snake</h3>
                <p>Eat, grow, don't crash.<br>Swipe or tap arrows</p>
            </button>
            <button class="game-card" data-game="pong">
                <h3>Pong</h3>
                <p>Beat the CPU to 5.<br>Slide your paddle</p>
            </button>
            <button class="game-card" data-game="breakout">
                <h3>Breakout</h3>
                <p>Smash every brick.<br>Slide to move</p>
            </button>
        </div>

        <div class="menu-title">Multiplayer · one device</div>
        <div class="menu">
            <button class="game-card" data-game="tron">
                <h3>Tron</h3>
                <p>Light cycles, 2&ndash;4 players.<br>Tap to turn L / R</p>
            </button>
            <button class="game-card" data-game="pong2p">
                <h3>Pong 2P</h3>
                <p>Duel to 5 points.<br>Slide your paddle</p>
            </button>
            <button class="game-card" data-game="tanks">
                <h3>Tank Battle</h3>
                <p>Shoot first, win.<br>Turn · Thrust · Fire</p>
            </button>
        </div>
        <p class="hint">2-player games: sit at opposite ends &mdash; Player 2's pad is flipped to face you.</p>
    </div>

    <!-- Game stage -->
    <div id="stage" class="stage">
        <div id="padTop" class="pad-area top"></div>
        <div class="hud">
            <span id="hudLeft">SCORE: 0</span>
            <span id="hudRight">BEST: 0</span>
        </div>
        <div class="canvas-wrap">
            <canvas id="canvas" width="360" height="360"></canvas>
            <div id="pauseOverlay" class="pause-overlay">PAUSED</div>
        </div>
        <div id="hint" class="hint"></div>
        <div id="padBottom" class="pad-area"></div>
        <div class="controls">
            <button class="btn" id="restartBtn">Restart</button>
            <button class="btn" id="pauseBtn">Pause</button>
            <button class="btn" id="soundBtn">Sound: On</button>
            <button class="btn" id="menuBtn">&larr; Menu</button>
        </div>
    </div>

    <footer>
        <a class="back" href="/">&larr; Back to home</a>
    </footer>
</div>
<div class="crt"></div>

<script>
    // ---- Typewriter tagline ----
    (function () {
        const text = "Insert coin. Pick a game. ";
        const el = document.getElementById('tagline');
        let i = 0;
        const t = setInterval(function () {
            if (i < text.length) el.textContent = text.substring(0, ++i);
            else clearInterval(t);
        }, 90);
    })();

    const AMBER = '#835e0c';
    const AMBER_BRIGHT = '#c79520';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const menuEl = document.getElementById('menu');
    const stage = document.getElementById('stage');
    const hudLeft = document.getElementById('hudLeft');
    const hudRight = document.getElementById('hudRight');
    const hint = document.getElementById('hint');
    const padTop = document.getElementById('padTop');
    const padBottom = document.getElementById('padBottom');
    const restartBtn = document.getElementById('restartBtn');
    const menuBtn = document.getElementById('menuBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const soundBtn = document.getElementById('soundBtn');
    const pauseOverlay = document.getElementById('pauseOverlay');

    let currentGame = null;
    let currentFactory = null;
    let paused = false;

    // ---- Sound (WebAudio retro beeps) ----
    const Sound = (function () {
        let actx;
        let muted = localStorage.getItem('minigames-muted') === '1';
        function ac() {
            if (!actx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) actx = new AC();
            }
            if (actx && actx.state === 'suspended') actx.resume();
            return actx;
        }
        function beep(freq, dur, type) {
            if (muted) return;
            const a = ac();
            if (!a) return;
            try {
                const o = a.createOscillator(), g = a.createGain();
                o.type = type || 'square';
                o.frequency.value = freq;
                o.connect(g); g.connect(a.destination);
                const now = a.currentTime;
                g.gain.setValueAtTime(0.05, now);
                g.gain.exponentialRampToValueAtTime(0.0001, now + (dur || 0.08));
                o.start(now);
                o.stop(now + (dur || 0.08));
            } catch (e) { /* ignore */ }
        }
        return {
            resume: function () { ac(); },
            isMuted: function () { return muted; },
            toggle: function () {
                muted = !muted;
                localStorage.setItem('minigames-muted', muted ? '1' : '0');
                return muted;
            },
            blip: function () { beep(660, 0.04, 'square'); },
            eat: function () { beep(880, 0.07, 'square'); },
            bounce: function () { beep(440, 0.05, 'triangle'); },
            score: function () { beep(523, 0.14, 'sawtooth'); },
            crash: function () { beep(110, 0.3, 'sawtooth'); },
            fire: function () { beep(300, 0.05, 'square'); },
            win: function () { beep(784, 0.18, 'square'); }
        };
    })();

    // ---- Persistence ----
    function bestKey(n) { return 'minigames-best-' + n; }
    function getBest(n) { return parseInt(localStorage.getItem(bestKey(n)) || '0', 10); }
    function setBest(n, v) { if (v > getBest(n)) localStorage.setItem(bestKey(n), String(v)); }

    // ---- Responsive canvas sizing ----
    function setCanvasSize(w, h) {
        canvas.width = w;
        canvas.height = h;
        fitCanvas();
    }
    function fitCanvas() {
        const aspect = canvas.width / canvas.height;
        const maxW = Math.min(window.innerWidth - 24, 460);
        const twoPlayer = padTop.children.length > 0;
        const maxH = window.innerHeight * (twoPlayer ? 0.42 : 0.55);
        let w = maxW, h = w / aspect;
        if (h > maxH) { h = maxH; w = h * aspect; }
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
    }
    window.addEventListener('resize', fitCanvas);

    // Map a pointer/touch position to canvas coordinates
    function canvasPos(clientX, clientY) {
        const r = canvas.getBoundingClientRect();
        return {
            x: (clientX - r.left) * (canvas.width / r.width),
            y: (clientY - r.top) * (canvas.height / r.height)
        };
    }

    // ---- Touch button factory ----
    function makeBtn(label, opts) {
        opts = opts || {};
        const b = document.createElement('button');
        b.className = 'pad-btn' + (opts.className ? ' ' + opts.className : '');
        b.innerHTML = label;
        let pressed = false;
        function down(e) {
            e.preventDefault();
            if (pressed) return;
            pressed = true;
            Sound.resume();
            b.classList.add('active');
            if (opts.onPress) opts.onPress();
        }
        function up(e) {
            if (e) e.preventDefault();
            if (!pressed) return;
            pressed = false;
            b.classList.remove('active');
            if (opts.onRelease) opts.onRelease();
        }
        b.addEventListener('touchstart', down, { passive: false });
        b.addEventListener('touchend', up);
        b.addEventListener('touchcancel', up);
        b.addEventListener('mousedown', down);
        b.addEventListener('mouseup', up);
        b.addEventListener('mouseleave', up);
        return b;
    }
    function padGroup() {
        const d = document.createElement('div');
        d.className = 'pad-row';
        return d;
    }

    function clearPads() { padTop.innerHTML = ''; padBottom.innerHTML = ''; }

    function stopCurrent() {
        if (currentGame && currentGame.stop) currentGame.stop();
        currentGame = null;
    }

    function setPaused(p) {
        paused = p;
        pauseOverlay.classList.toggle('show', p);
        pauseBtn.textContent = p ? 'Resume' : 'Pause';
    }

    function showMenu() {
        stopCurrent();
        clearPads();
        setPaused(false);
        document.body.classList.remove('playing');
        stage.classList.remove('active');
        menuEl.style.display = 'block';
    }

    function launch(factory) {
        Sound.resume();
        currentFactory = factory;
        menuEl.style.display = 'none';
        document.body.classList.add('playing');
        stage.classList.add('active');
        startCurrent();
    }

    function startCurrent() {
        stopCurrent();
        clearPads();
        setPaused(false);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        currentGame = currentFactory();
        fitCanvas();
    }

    restartBtn.addEventListener('click', startCurrent);
    menuBtn.addEventListener('click', showMenu);
    pauseBtn.addEventListener('click', function () {
        if (currentGame) setPaused(!paused);
    });
    soundBtn.addEventListener('click', function () {
        const muted = Sound.toggle();
        soundBtn.textContent = 'Sound: ' + (muted ? 'Off' : 'On');
        if (!muted) { Sound.resume(); Sound.blip(); }
    });
    soundBtn.textContent = 'Sound: ' + (Sound.isMuted() ? 'Off' : 'On');

    document.querySelectorAll('.game-card').forEach(function (card) {
        card.addEventListener('click', function () {
            launch(GAMES[card.getAttribute('data-game')]);
        });
    });

    function centerText(lines) {
        ctx.fillStyle = AMBER_BRIGHT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const fs = Math.max(16, canvas.width * 0.06);
        const startY = canvas.height / 2 - ((lines.length - 1) * (fs + 8)) / 2;
        lines.forEach(function (line, idx) {
            const size = idx === 0 ? fs : Math.round(fs * 0.7);
            ctx.font = (idx === 0 ? 'bold ' : '') + size + 'px "Courier New", monospace';
            ctx.fillText(line, canvas.width / 2, startY + idx * (fs + 8));
        });
        ctx.textAlign = 'start';
        ctx.textBaseline = 'alphabetic';
    }

    // =====================================================================
    //  SNAKE  (swipe on board or tap d-pad)
    // =====================================================================
    function createSnake() {
        setCanvasSize(360, 360);
        const grid = 20, cell = canvas.width / grid;
        const name = 'snake';
        let snake, dir, nextDir, food, score, dead, started, timer;

        hint.textContent = 'Swipe the board or tap the arrows.';
        hudRight.textContent = 'BEST: ' + getBest(name);

        function reset() {
            snake = [{ x: 10, y: 10 }];
            dir = { x: 0, y: 0 };
            nextDir = { x: 0, y: 0 };
            score = 0; dead = false; started = false;
            placeFood();
            hudLeft.textContent = 'SCORE: 0';
            draw();
        }
        function placeFood() {
            do { food = { x: (Math.random() * grid) | 0, y: (Math.random() * grid) | 0 }; }
            while (snake.some(s => s.x === food.x && s.y === food.y));
        }
        function step() {
            if (paused || dead || !started) return;
            dir = nextDir;
            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
            if (head.x < 0 || head.y < 0 || head.x >= grid || head.y >= grid ||
                snake.some(s => s.x === head.x && s.y === head.y)) {
                dead = true;
                Sound.crash();
                setBest(name, score);
                hudRight.textContent = 'BEST: ' + getBest(name);
                draw();
                return;
            }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score++; Sound.eat(); hudLeft.textContent = 'SCORE: ' + score; placeFood();
            } else snake.pop();
            draw();
        }
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = AMBER_BRIGHT;
            ctx.fillRect(food.x * cell + 2, food.y * cell + 2, cell - 4, cell - 4);
            snake.forEach(function (s, i) {
                ctx.fillStyle = i === 0 ? AMBER_BRIGHT : AMBER;
                ctx.fillRect(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2);
            });
            if (dead) {
                ctx.fillStyle = 'rgba(0,0,0,0.72)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                centerText(['GAME OVER', 'Score: ' + score, 'Press Restart']);
            }
        }
        function turn(x, y) {
            if (snake.length > 1 && x === -dir.x && y === -dir.y) return;
            nextDir = { x: x, y: y };
            if (!started) { started = true; hint.textContent = ''; }
        }

        // d-pad
        const top = padGroup(), mid = padGroup();
        const col = document.createElement('div'); col.className = 'pad-col';
        top.appendChild(makeBtn('&uarr;', { onPress: () => turn(0, -1) }));
        mid.appendChild(makeBtn('&larr;', { onPress: () => turn(-1, 0) }));
        mid.appendChild(makeBtn('&darr;', { onPress: () => turn(0, 1) }));
        mid.appendChild(makeBtn('&rarr;', { onPress: () => turn(1, 0) }));
        col.appendChild(top); col.appendChild(mid);
        padBottom.appendChild(col);

        // swipe
        let sx = 0, sy = 0;
        function ts(e) { const t = e.touches ? e.touches[0] : e; sx = t.clientX; sy = t.clientY; }
        function te(e) {
            const t = e.changedTouches ? e.changedTouches[0] : e;
            const dx = t.clientX - sx, dy = t.clientY - sy;
            if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
            if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
            else turn(0, dy > 0 ? 1 : -1);
        }
        canvas.addEventListener('touchstart', ts, { passive: true });
        canvas.addEventListener('touchend', te);

        reset();
        timer = setInterval(step, 110);
        return {
            stop: function () {
                clearInterval(timer);
                canvas.removeEventListener('touchstart', ts);
                canvas.removeEventListener('touchend', te);
            }
        };
    }

    // ---- shared vertical-pong helper used by 1P & 2P ----
    function verticalPong(opts) {
        // opts.cpu === true  => top paddle is AI
        const W = 360, H = 520;
        setCanvasSize(W, H);
        const pw = 78, ph = 12;
        const bottom = { x: W / 2 - pw / 2, score: 0, dir: 0 };
        const top = { x: W / 2 - pw / 2, score: 0, dir: 0 };
        const bottomY = H - 22, topY = 10;
        const ball = {};
        let raf, over = false, winner = '';

        function resetBall(dir) {
            ball.x = W / 2; ball.y = H / 2; ball.r = 7;
            const a = Math.random() * 0.6 - 0.3, sp = 4.4;
            ball.vx = sp * Math.sin(a);
            ball.vy = dir * sp * Math.cos(a);
        }
        function updateHud() {
            hudLeft.textContent = 'P1: ' + bottom.score;
            hudRight.textContent = (opts.cpu ? 'CPU: ' : 'P2: ') + top.score;
        }
        function bounce(p) {
            ball.vy *= -1.05;
            ball.vx += ((ball.x - (p.x + pw / 2)) / (pw / 2)) * 2;
            Sound.bounce();
        }
        function loop() {
            if (over) return;
            if (paused) { raf = requestAnimationFrame(loop); return; }
            const sp = 6;
            bottom.x = clamp(bottom.x + bottom.dir * sp);
            if (opts.cpu) {
                const target = ball.x - pw / 2, cs = 4.2;
                if (top.x + 2 < target) top.x += cs; else if (top.x - 2 > target) top.x -= cs;
                top.x = clamp(top.x);
            } else {
                top.x = clamp(top.x + top.dir * sp);
            }

            ball.x += ball.vx; ball.y += ball.vy;
            if (ball.x - ball.r < 0 || ball.x + ball.r > W) {
                ball.vx *= -1; ball.x = Math.max(ball.r, Math.min(W - ball.r, ball.x));
            }
            if (ball.y - ball.r < topY + ph && ball.x > top.x && ball.x < top.x + pw && ball.vy < 0) {
                bounce(top); ball.y = topY + ph + ball.r;
            }
            if (ball.y + ball.r > bottomY && ball.x > bottom.x && ball.x < bottom.x + pw && ball.vy > 0) {
                bounce(bottom); ball.y = bottomY - ball.r;
            }
            if (ball.y < 0) { bottom.score++; Sound.score(); updateHud(); win(); resetBall(1); }
            else if (ball.y > H) { top.score++; Sound.score(); updateHud(); win(); resetBall(-1); }

            draw();
            raf = requestAnimationFrame(loop);
        }
        function clamp(x) { return Math.max(0, Math.min(W - pw, x)); }
        function win() {
            if (bottom.score >= 5) { over = true; winner = 'PLAYER 1 WINS'; }
            else if (top.score >= 5) { over = true; winner = opts.cpu ? 'CPU WINS' : 'PLAYER 2 WINS'; }
            if (over) { Sound.win(); draw(); }
        }
        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = AMBER; ctx.setLineDash([8, 12]);
            ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = AMBER_BRIGHT; ctx.fillRect(bottom.x, bottomY, pw, ph);
            ctx.fillStyle = opts.cpu ? AMBER : AMBER_BRIGHT; ctx.fillRect(top.x, topY, pw, ph);
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
            if (over) {
                ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
                centerText([winner, 'Press Restart']);
            }
        }

        hint.textContent = opts.cpu
            ? 'Slide the board or use the buttons. First to 5.'
            : 'Each player slides their own paddle. First to 5.';

        // bottom player controls
        const rowB = padGroup();
        rowB.appendChild(makeBtn('&larr;', { onPress: () => bottom.dir = -1, onRelease: () => { if (bottom.dir < 0) bottom.dir = 0; } }));
        rowB.appendChild(makeBtn('&rarr;', { onPress: () => bottom.dir = 1, onRelease: () => { if (bottom.dir > 0) bottom.dir = 0; } }));
        padBottom.appendChild(rowB);

        if (!opts.cpu) {
            const rowT = padGroup();
            rowT.appendChild(makeBtn('&larr;', { onPress: () => top.dir = -1, onRelease: () => { if (top.dir < 0) top.dir = 0; } }));
            rowT.appendChild(makeBtn('&rarr;', { onPress: () => top.dir = 1, onRelease: () => { if (top.dir > 0) top.dir = 0; } }));
            padTop.appendChild(rowT);
        }

        // drag controls paddles; multi-touch lets both players slide at once
        function applyPoint(clientX, clientY) {
            const p = canvasPos(clientX, clientY);
            if (p.y > H / 2) bottom.x = clamp(p.x - pw / 2);
            else if (!opts.cpu) top.x = clamp(p.x - pw / 2);
        }
        function drag(e) {
            if (e.touches) { for (const t of e.touches) applyPoint(t.clientX, t.clientY); }
            else applyPoint(e.clientX, e.clientY);
        }
        function dstart(e) { e.preventDefault(); drag(e); }
        canvas.addEventListener('touchstart', dstart, { passive: false });
        canvas.addEventListener('touchmove', drag, { passive: false });

        updateHud();
        resetBall(Math.random() < 0.5 ? 1 : -1);
        raf = requestAnimationFrame(loop);
        return {
            stop: function () {
                over = true; cancelAnimationFrame(raf);
                canvas.removeEventListener('touchstart', dstart);
                canvas.removeEventListener('touchmove', drag);
            }
        };
    }
    function createPong() { return verticalPong({ cpu: true }); }
    function createPong2P() { return verticalPong({ cpu: false }); }

    // =====================================================================
    //  BREAKOUT
    // =====================================================================
    function createBreakout() {
        const W = 360, H = 480;
        setCanvasSize(W, H);
        const name = 'breakout';
        const cols = 7, rows = 5;
        const brickW = (W - 20) / cols, brickH = 18, brickTop = 40, gap = 4;
        let bricks, paddle, ball, score, lives, raf, state, dir = 0;

        hint.textContent = 'Slide the board or use the buttons.';
        hudRight.textContent = 'BEST: ' + getBest(name);

        function reset() {
            bricks = [];
            for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) bricks.push({ c, r, alive: true });
            paddle = { w: 80, h: 12, x: W / 2 - 40, y: H - 26 };
            resetBall(); score = 0; lives = 3; state = 'play';
            updateHud();
        }
        function resetBall() { ball = { x: W / 2, y: H - 44, r: 6, vx: 3, vy: -3.4 }; }
        function updateHud() { hudLeft.textContent = 'SCORE: ' + score + '  LIVES: ' + lives; }
        function clampP(x) { return Math.max(0, Math.min(W - paddle.w, x)); }

        function loop() {
            if (state !== 'play') return;
            if (paused) { raf = requestAnimationFrame(loop); return; }
            paddle.x = clampP(paddle.x + dir * 7);
            ball.x += ball.vx; ball.y += ball.vy;
            if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; Sound.bounce(); }
            if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx *= -1; Sound.bounce(); }
            if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; Sound.bounce(); }
            if (ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 6 &&
                ball.x >= paddle.x && ball.x <= paddle.x + paddle.w && ball.vy > 0) {
                ball.vy *= -1;
                ball.vx = ((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2)) * 4.5;
                ball.y = paddle.y - ball.r;
                Sound.bounce();
            }
            if (ball.y - ball.r > H) {
                lives--; Sound.crash(); updateHud();
                if (lives <= 0) {
                    state = 'over'; setBest(name, score);
                    hudRight.textContent = 'BEST: ' + getBest(name); draw(); return;
                }
                resetBall();
            }
            for (const b of bricks) {
                if (!b.alive) continue;
                const bx = 10 + b.c * brickW, by = brickTop + b.r * (brickH + gap);
                if (ball.x + ball.r > bx + gap / 2 && ball.x - ball.r < bx + brickW - gap / 2 &&
                    ball.y + ball.r > by && ball.y - ball.r < by + brickH) {
                    b.alive = false; ball.vy *= -1; score += 10; Sound.blip(); updateHud(); break;
                }
            }
            if (bricks.every(b => !b.alive)) {
                state = 'win'; Sound.win(); setBest(name, score);
                hudRight.textContent = 'BEST: ' + getBest(name); draw(); return;
            }
            draw();
            raf = requestAnimationFrame(loop);
        }
        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
            for (const b of bricks) {
                if (!b.alive) continue;
                const bx = 10 + b.c * brickW, by = brickTop + b.r * (brickH + gap);
                ctx.fillStyle = b.r % 2 === 0 ? AMBER_BRIGHT : AMBER;
                ctx.fillRect(bx + gap / 2, by, brickW - gap, brickH);
            }
            ctx.fillStyle = AMBER_BRIGHT; ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
            if (state === 'over' || state === 'win') {
                ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
                centerText([state === 'win' ? 'YOU WIN!' : 'GAME OVER', 'Score: ' + score, 'Press Restart']);
            }
        }

        const row = padGroup();
        row.appendChild(makeBtn('&larr;', { onPress: () => dir = -1, onRelease: () => { if (dir < 0) dir = 0; } }));
        row.appendChild(makeBtn('&rarr;', { onPress: () => dir = 1, onRelease: () => { if (dir > 0) dir = 0; } }));
        padBottom.appendChild(row);

        function drag(e) {
            const t = e.touches ? e.touches[0] : e;
            const p = canvasPos(t.clientX, t.clientY);
            paddle.x = clampP(p.x - paddle.w / 2);
        }
        function dstart(e) { e.preventDefault(); drag(e); }
        canvas.addEventListener('touchstart', dstart, { passive: false });
        canvas.addEventListener('touchmove', drag, { passive: false });

        reset();
        raf = requestAnimationFrame(loop);
        return {
            stop: function () {
                state = 'over'; cancelAnimationFrame(raf);
                canvas.removeEventListener('touchstart', dstart);
                canvas.removeEventListener('touchmove', drag);
            }
        };
    }

    // =====================================================================
    //  TRON  (2-4 players, tap to turn left/right relative to heading)
    // =====================================================================
    function createTron() {
        const W = 360, H = 360;
        setCanvasSize(W, H);
        const cell = 6, cols = W / cell, rows = H / cell;
        // warm arcade palette, one per player
        const COLORS = ['#c79520', '#f2d65a', '#d2691e', '#ff9e3d'];
        // start pose for each player slot: position + heading
        const STARTS = [
            { x: 0.5, y: 0.82, dx: 0, dy: -1 },  // P1 bottom, heading up
            { x: 0.5, y: 0.18, dx: 0, dy: 1 },   // P2 top, heading down
            { x: 0.18, y: 0.5, dx: 1, dy: 0 },   // P3 left, heading right
            { x: 0.82, y: 0.5, dx: -1, dy: 0 }   // P4 right, heading left
        ];

        let occupied, players, timer, over, started, winner, count = 0;

        function idx(x, y) { return y * cols + x; }
        function mark(p) { occupied[idx(p.x, p.y)] = p; }
        function steer(p, left) {
            if (!p.alive) return;
            const dx = p.dx, dy = p.dy;
            if (left) { p.dx = dy; p.dy = -dx; } else { p.dx = -dy; p.dy = dx; }
            if (!started) { started = true; hint.textContent = ''; }
        }
        function hits(n) {
            if (n.x < 0 || n.y < 0 || n.x >= cols || n.y >= rows) return true;
            return occupied[idx(n.x, n.y)] !== 0;
        }
        function aliveCount() { return players.filter(p => p.alive).length; }

        function start(n) {
            count = n;
            clearPads();
            occupied = new Array(cols * rows).fill(0);
            players = [];
            for (let i = 0; i < n; i++) {
                const s = STARTS[i];
                const p = {
                    id: i + 1, color: COLORS[i], alive: true,
                    x: (cols * s.x) | 0, y: (rows * s.y) | 0, dx: s.dx, dy: s.dy
                };
                players.push(p);
                mark(p);
            }
            over = false; started = false; winner = '';
            updateHud();
            buildControls();
            hint.textContent = 'Tap L / R to steer. Last cycle alive wins.';
            draw();
            timer = setInterval(step, 70);
        }

        function updateHud() {
            hudLeft.textContent = count + ' PLAYERS';
            hudRight.textContent = 'ALIVE: ' + (players ? aliveCount() : count);
        }

        function step() {
            if (paused || over || !started) return;
            const alive = players.filter(p => p.alive);
            const moves = alive.map(p => ({ p, n: { x: p.x + p.dx, y: p.y + p.dy } }));
            // mark deaths: wall/trail hit, or two heads to the same cell
            moves.forEach(m => { m.dead = hits(m.n); });
            for (let i = 0; i < moves.length; i++)
                for (let j = i + 1; j < moves.length; j++)
                    if (moves[i].n.x === moves[j].n.x && moves[i].n.y === moves[j].n.y) {
                        moves[i].dead = moves[j].dead = true;
                    }
            let crashed = false;
            moves.forEach(m => {
                if (m.dead) { m.p.alive = false; crashed = true; return; }
                m.p.x = m.n.x; m.p.y = m.n.y; mark(m.p);
            });
            if (crashed) Sound.crash();
            updateHud();
            if (aliveCount() <= (count > 1 ? 1 : 0)) endGame();
            else draw();
        }

        function endGame() {
            over = true;
            clearInterval(timer);
            const survivors = players.filter(p => p.alive);
            winner = survivors.length === 1 ? 'PLAYER ' + survivors[0].id + ' WINS' : 'DRAW';
            Sound.win();
            draw();
        }

        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
            for (let i = 0; i < occupied.length; i++) {
                const o = occupied[i]; if (o === 0) continue;
                ctx.fillStyle = o.color;
                ctx.fillRect((i % cols) * cell, ((i / cols) | 0) * cell, cell - 1, cell - 1);
            }
            ctx.fillStyle = '#fff';
            players.forEach(p => { if (p.alive) ctx.fillRect(p.x * cell, p.y * cell, cell - 1, cell - 1); });
            if (over) {
                ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, W, H);
                centerText([winner, 'Press Restart']);
            }
        }

        function makeGroup(p, parent) {
            const g = document.createElement('div');
            g.className = 'pad-group';
            const lbl = document.createElement('div');
            lbl.className = 'pad-label';
            lbl.textContent = 'P' + p.id;
            lbl.style.color = p.color;
            const row = padGroup();
            row.appendChild(makeBtn('&#8634;', { onPress: () => { steer(p, true); Sound.blip(); } }));
            row.appendChild(makeBtn('&#8635;', { onPress: () => { steer(p, false); Sound.blip(); } }));
            g.appendChild(lbl); g.appendChild(row);
            parent.appendChild(g);
        }

        function buildControls() {
            // odd players (1,3) face you at the bottom; even (2,4) sit opposite at the top
            players.forEach(p => makeGroup(p, p.id % 2 === 1 ? padBottom : padTop));
            fitCanvas();
        }

        // ---- player-count chooser ----
        function showChooser() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
            centerText(['TRON', 'How many players?']);
            hudLeft.textContent = 'TRON';
            hudRight.textContent = '';
            hint.textContent = 'Pick 2, 3 or 4 players.';
            const row = padGroup();
            [2, 3, 4].forEach(n => row.appendChild(makeBtn(String(n) + 'P', { className: 'wide', onPress: () => start(n) })));
            padBottom.appendChild(row);
        }

        showChooser();
        return { stop: function () { clearInterval(timer); } };
    }

    // =====================================================================
    //  TANK BATTLE  (2-player: turn, thrust, fire)
    // =====================================================================
    function createTanks() {
        const W = 360, H = 420;
        setCanvasSize(W, H);
        let raf, state, winner;
        const bullets = [];
        const walls = [
            { x: 100, y: 80, w: 18, h: 90 },
            { x: 242, y: 80, w: 18, h: 90 },
            { x: 100, y: 250, w: 18, h: 90 },
            { x: 242, y: 250, w: 18, h: 90 },
            { x: 160, y: 40, w: 40, h: 16 },
            { x: 160, y: 364, w: 40, h: 16 },
            { x: 165, y: 200, w: 30, h: 20 }
        ];
        const SIZE = 16;
        let t1, t2;

        hint.textContent = 'Turn, thrust and fire. First to 5 hits.';

        function reset() {
            t1 = { x: W / 2, y: H - 40, a: -Math.PI / 2, score: t1 ? t1.score : 0, color: AMBER, fire: false, cd: 0, turn: 0, thrust: false };
            t2 = { x: W / 2, y: 40, a: Math.PI / 2, score: t2 ? t2.score : 0, color: AMBER_BRIGHT, fire: false, cd: 0, turn: 0, thrust: false };
            bullets.length = 0; state = 'play'; winner = '';
            updateHud();
        }
        function updateHud() { hudLeft.textContent = 'P1: ' + t1.score; hudRight.textContent = 'P2: ' + t2.score; }
        function rectHit(px, py, r) {
            for (const w of walls)
                if (px + r > w.x && px - r < w.x + w.w && py + r > w.y && py - r < w.y + w.h) return true;
            return false;
        }
        function updateTank(t) {
            if (t.turn) t.a += t.turn * 0.06;
            if (t.thrust) {
                const nx = t.x + Math.cos(t.a) * 2.2, ny = t.y + Math.sin(t.a) * 2.2;
                if (!rectHit(nx, ny, SIZE / 2) && nx > SIZE / 2 && nx < W - SIZE / 2 && ny > SIZE / 2 && ny < H - SIZE / 2) {
                    t.x = nx; t.y = ny;
                }
            }
            if (t.cd > 0) t.cd--;
            if (t.fire && t.cd === 0) {
                bullets.push({
                    x: t.x + Math.cos(t.a) * (SIZE / 2 + 4), y: t.y + Math.sin(t.a) * (SIZE / 2 + 4),
                    vx: Math.cos(t.a) * 5, vy: Math.sin(t.a) * 5, owner: t, life: 130
                });
                t.cd = 32;
                Sound.fire();
            }
        }
        function loop() {
            if (state !== 'play') return;
            if (paused) { raf = requestAnimationFrame(loop); return; }
            updateTank(t1); updateTank(t2);
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx; b.y += b.vy; b.life--;
                if (b.x < 0 || b.x > W) { b.vx *= -1; b.x = Math.max(0, Math.min(W, b.x)); }
                if (b.y < 0 || b.y > H) { b.vy *= -1; b.y = Math.max(0, Math.min(H, b.y)); }
                for (const w of walls) {
                    if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h) {
                        const ox = Math.min(b.x - w.x, w.x + w.w - b.x);
                        const oy = Math.min(b.y - w.y, w.y + w.h - b.y);
                        if (ox < oy) b.vx *= -1; else b.vy *= -1;
                        b.x += b.vx; b.y += b.vy;
                    }
                }
                const foe = b.owner === t1 ? t2 : t1;
                if (Math.hypot(b.x - foe.x, b.y - foe.y) < SIZE / 2 + 2) {
                    b.owner.score++; bullets.splice(i, 1); Sound.crash(); updateHud();
                    if (b.owner.score >= 5) {
                        state = 'over'; winner = (b.owner === t1 ? 'PLAYER 1 WINS' : 'PLAYER 2 WINS'); Sound.win(); draw(); return;
                    }
                    state = 'round'; winner = (b.owner === t1 ? 'PLAYER 1' : 'PLAYER 2') + ' SCORES'; draw();
                    setTimeout(function () {
                        if (state === 'round') { respawn(); state = 'play'; raf = requestAnimationFrame(loop); }
                    }, 850);
                    return;
                }
                if (b.life <= 0) bullets.splice(i, 1);
            }
            draw();
            raf = requestAnimationFrame(loop);
        }
        function respawn() {
            t1.x = W / 2; t1.y = H - 40; t1.a = -Math.PI / 2;
            t2.x = W / 2; t2.y = 40; t2.a = Math.PI / 2;
            t1.fire = t2.fire = false; t1.thrust = t2.thrust = false; t1.turn = t2.turn = 0;
            bullets.length = 0;
        }
        function drawTank(t) {
            ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.a);
            ctx.fillStyle = t.color; ctx.fillRect(-SIZE / 2, -SIZE / 2, SIZE, SIZE);
            ctx.fillStyle = '#fff'; ctx.fillRect(0, -2, SIZE / 2 + 4, 4);
            ctx.restore();
        }
        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = AMBER; ctx.globalAlpha = 0.55;
            for (const w of walls) ctx.fillRect(w.x, w.y, w.w, w.h);
            ctx.globalAlpha = 1;
            drawTank(t1); drawTank(t2);
            ctx.fillStyle = '#fff';
            for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill(); }
            if (state === 'round' || state === 'over') {
                ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
                centerText(state === 'over' ? [winner, 'Press Restart'] : [winner]);
            }
        }

        function controlsFor(t, parent) {
            const row = padGroup();
            row.appendChild(makeBtn('&#8634;', { onPress: () => t.turn = -1, onRelease: () => { if (t.turn < 0) t.turn = 0; } }));
            row.appendChild(makeBtn('&#9650;', { onPress: () => t.thrust = true, onRelease: () => t.thrust = false }));
            row.appendChild(makeBtn('&#8635;', { onPress: () => t.turn = 1, onRelease: () => { if (t.turn > 0) t.turn = 0; } }));
            row.appendChild(makeBtn('&#128163;', { className: 'wide', onPress: () => t.fire = true, onRelease: () => t.fire = false }));
            parent.appendChild(row);
        }
        reset();
        controlsFor(t1, padBottom);
        controlsFor(t2, padTop);

        raf = requestAnimationFrame(loop);
        return { stop: function () { state = 'over'; cancelAnimationFrame(raf); } };
    }

    const GAMES = {
        snake: createSnake,
        pong: createPong,
        breakout: createBreakout,
        tron: createTron,
        pong2p: createPong2P,
        tanks: createTanks
    };
</script>
</body>
